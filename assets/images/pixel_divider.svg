<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 8" shape-rendering="crispEdges">
  <defs>
    <pattern id="px" width="64" height="8" patternUnits="userSpaceOnUse">
      <rect x="0" y="2" width="14" height="4" fill="#029699" opacity="0.85"/>
      <rect x="16" y="2" width="14" height="4" fill="#fabd2f" opacity="0.85"/>
      <rect x="32" y="2" width="14" height="4" fill="#83a598" opacity="0.85"/>
      <rect x="48" y="2" width="14" height="4" fill="#fe8012" opacity="0.85"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="400" height="8" fill="url(#px)"/>
  <rect x="0" y="2" width="14" height="4" fill="#f9f5d7" opacity="0.45">
    <animate attributeName="x" values="0;386;0" dur="6s" repeatCount="indefinite"/>
