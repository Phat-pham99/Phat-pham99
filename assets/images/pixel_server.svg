  <rect x="3" y="8" width="1" height="1" fill="#b8bb26">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.0s" repeatCount="indefinite"/>
  </rect>
  <rect x="4" y="8" width="1" height="1" fill="#9d0006"/>

  <rect x="2" y="12" width="12" height="4" fill="#3c3836"/>
  <rect x="6" y="13" width="7" height="1" fill="#a89984"/>
  <rect x="3" y="13" width="1" height="1" fill="#b8bb26">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.8s" repeatCount="indefinite"/>
