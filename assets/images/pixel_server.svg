<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 18" shape-rendering="crispEdges">
  <rect x="0" y="0" width="16" height="18" fill="#7c6f64"/>
  <rect x="1" y="1" width="14" height="16" fill="#282828"/>
  <rect x="3" y="17" width="3" height="1" fill="#7c6f64"/>
  <rect x="10" y="17" width="3" height="1" fill="#7c6f64"/>

  <rect x="2" y="2" width="12" height="4" fill="#3c3836"/>
  <rect x="6" y="3" width="7" height="1" fill="#a89984"/>
